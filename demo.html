<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo — Community Resilience Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* soft colours only for this page */
    .card-status {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
    }
    .card-name {
      background: #e3f2fd;
      border: 1px solid #bbdefb;
    }
    .card-report {
      background: #fff8e1;
      border: 1px solid #ffecb3;
    }
    .hub-title {
      background: #1a3a5c;
      color: white;
      text-align: center;
      padding: 0.7rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Community Resilience Hub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="solution.html">Solution</a>
      <a href="sdgs.html">SDGs</a>
      <a href="users.html">Users</a>
      <a href="demo.html">Demo</a>
    </nav>
  </header>

  <main>
    <div class="hub-title">HubConnect</div>

    <section class="card card-status">
      <h3>Water point • Operational</h3>
      <p id="status">Click the button to check status.</p>
      <button onclick="checkStatus()">Check Status</button>
    </section>

    <section class="card card-name">
      <h3>Enter your name</h3>
      <form onsubmit="return sendRequest(event)">
        <input type="text" id="name" required placeholder="e.g. Amina"><br><br>
        <label for="need">What do you need?</label><br>
        <select id="need">
          <option value="water">Water point information</option>
          <option value="garden">Join growing programme</option>
          <option value="work">Training for local role</option>
        </select><br><br>
        <button type="submit">Submit request</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="card card-report">
      <h3>Report a problem</h3>
      <form onsubmit="return submitReport(event)">
        <label for="issue-type">What needs attention?</label><br>
        <select id="issue-type">
          <option value="Water point">Water point</option>
          <option value="Garden">Garden</option>
          <option value="Other">Other</option>
        </select><br><br>
        <label for="description">Description</label><br>
        <textarea id="description" rows="3" placeholder="Describe the problem here..." required></textarea><br><br>
        <button type="submit">Submit report</button>
      </form>
      <p id="report-message"></p>
    </section>
  </main>

  <footer>
    <p>Global Citizenship Project • SDG 1 • SDG 2 • SDG 6</p>
  </footer>

  <script>
    function checkStatus() {
      var statuses = [
        "Tank level: OK — water available",
        "Tank level: Low — operator notified",
        "Solar status: Charging normally",
        "Flow rate: Normal"
      ];
      var random = Math.floor(Math.random() * statuses.length);
      document.getElementById("status").textContent = statuses[random];
    }

    function sendRequest(event) {
      event.preventDefault();
      var name = document.getElementById("name").value;
      var need = document.getElementById("need").value;
      var text = "Thank you, " + name + ". Your request for " + need + " has been recorded. A community operator will follow up.";
      document.getElementById("message").textContent = text;
      return false;
    }

    function submitReport(event) {
      event.preventDefault();
      var type = document.getElementById("issue-type").value;
      var desc = document.getElementById("description").value;
      document.getElementById("report-message").textContent = "Report received for " + type + ". The operator has been notified.";
      document.getElementById("description").value = "";
      return false;
    }
  </script>
</body>
</html>
